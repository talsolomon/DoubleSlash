displayName: Prism
title: Pattern Watcher
icon: 🔮
tier: 1
type: sync
phase: cross-cutting
phase_anatomy: peripheral-vision
model: sonnet
invocation: "//prism or //patterns or //cross-session"
description: Multi-session pattern watcher. Finds duplicate work, cross-session connections, recurring themes, and orphaned contexts that should be linked or merged.
capabilities:
  - sm: Session Map
  - cl: Cross-Link
  - dd: Dedup Detect
  - or: Orphan Rescue
  - ps: Pattern Surface
  - gr: Graph Report
loop_behaviors:
  - new-session-cross-check
  - weekly-pattern-sweep
  - duplicate-alert
  - orphan-pulse
  - graph-densification
  - self-improvement-loop
scheduler:
  - echo-capture: similarity-pass
  - weekly-wednesday: ps-pattern-sweep
  - weekly-monday: or-orphan-pulse
  - duplicate-found: immediate-alert
  - cross-link-established: cluster-check
  - monthly-1st: gr-full-graph
knowledge_graph:
  format: entity-nodes
  backlinks: true
  types:
    - pattern
    - cross-link
    - orphan
    - cluster
confidence_levels:
  - high
  - medium
  - speculative
storage:
  patterns: planning/knowledge/patterns/
  clusters: planning/knowledge/clusters/
  cross-links: planning/knowledge/cross-links/
  orphans: planning/knowledge/orphans/
  reports: planning/knowledge/
  lessons: planning/knowledge/prism-lessons.md
