              - text: ה-PM מריץ/ה synthesis על ה-user interviews החדשים ב-Dovetail. מקבל/ת 5 themes. מוולידציה 3 מהם עם quantitative data. עובד/ת עם קלוד לבנות hypothesis doc. מציג/ה לצוות ב-15 דקות במקום שעה.
            - paragraph [ref=e231]:
              - strong [ref=e232]: "הגדרת scope:"
              - text: שיחת thinking עם קלוד שמחלצת את ה-product decisions הסמויים ב-feature request. כותב/ת brief. מבקש/ת מ-AI לייצר PRD draft. מדייק/ת. שולח/ת ל-review.
            - paragraph [ref=e233]:
              - strong [ref=e234]: "Backlog grooming:"
              - text: RICE scoring עם AI כ-thinking partner. בקשת אתגורים על הנחות. מוצאת/ת עמדה. מביאה/ה לדיון עם צוות ו-stakeholders.
            - paragraph [ref=e235]:
              - strong [ref=e236]: "כתיבת tickets:"
              - text: template עם AI. validation של edge cases (כולל pre-mortem). העברה ל-engineering עם context מלא.
            - paragraph [ref=e237]:
              - strong [ref=e238]: "Mid-sprint check:"
              - text: data dashboard עם AI synthesis. anomalies? pattern שמסמן בעיה? מגיב/ה מהר, לא מחכה ל-retro.
            - paragraph [ref=e239]:
              - strong [ref=e240]: "Retro + planning:"
