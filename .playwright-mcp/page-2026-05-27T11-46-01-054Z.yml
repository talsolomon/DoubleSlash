            - paragraph [ref=e264]: "ההכשרה הדרושה: להבין מה AI עושה טוב (synthesis, pattern recognition, drafting, challenging assumptions) ומה הוא לא עושה טוב (judgment ב-ambiguity, empathy, פוליטיקה ארגונית, timing). ולבנות workflow שמניח כל tool במקום הנכון שלו."
