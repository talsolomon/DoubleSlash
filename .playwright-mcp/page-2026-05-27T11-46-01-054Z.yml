            - paragraph [ref=e138]: "היום: מעלים את התמלולים ל-Dovetail (שיש לו AI synthesis מובנה ומחובר ישירות לממשק ה-research), או ל-Notion עם Notion AI, או עובדים ישירות עם קלוד עם prompt מוגדר. מבקשים: “מצא את חמשת ה-pain points החוזרים הכי הרבה, ציטוט לכל אחד, וכמה משתמשים/ות ציינו כל אחד.” תוך שעה מקבלים תמצות ב-95% דיוק."
            - blockquote [ref=e139]:
