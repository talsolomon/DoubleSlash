            - paragraph [ref=e189]: תכלס, הרבה מזה שעמם PMs לאורך שנים. “תתאר task ל-developer” - כמה פעמים כתבתם את אותו הריקוויירמנט עם קצת שינויים?
            - paragraph [ref=e190]: AI הפך את זה ל-leverage נקי. ה-PM מגדיר/ה ב-natural language מה צריך לקרות. קלוד ממיר/ה ל-structured ticket עם acceptance criteria, edge cases שצריך לחשוב עליהם (כולל כאלה שה-PM לא חשב/ה עליהם), ו-dependencies שכדאי לוולידציה. ה-PM מדייק/ת. ה-developer מקבל/ת משהו שאפשר לעבוד איתו.
