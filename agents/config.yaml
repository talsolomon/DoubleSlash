# Duble Slash agents — project-wide config
# Read on activation by every operator and expert SKILL.md.

project_name: Duble Slash
method: FLOW

# User-facing settings (overridable per-install in `.flow/flow.yaml`)
user_name: Tal
user_skill_level: expert
user_role: product-design-executive

# Language
communication_language: English
document_output_language: English

# Paths (relative to project-root)
planning_artifacts: "{project-root}/planning"
implementation_artifacts: "{project-root}/planning/stories"
project_knowledge: "{project-root}/planning/research"
methodology: "{project-root}/methodology"
flow_spec: "{project-root}/methodology/flow.md"

# Output folders (created on demand)
output_folder: planning
handoff_folder: "{project-root}/.flow/handoffs"
card_folder: "{project-root}/.flow/cards"

# Agent system — three-tier architecture
orchestrator_layer: "{project-root}/agents/orchestrators"   # Tier 0: Apex (PM), Guard (Warden)
sync_layer: "{project-root}/agents/sync"                    # Tier 1: Echo (Bridge), Prism (Watcher)
operator_layer: "{project-root}/agents/operators"           # Tier 2: Dora, Sol, Bran, May
expert_layer: "{project-root}/agents/experts"               # planned
helpers: "{project-root}/agents/helpers"

# Book canon — all agents load on activation as expertise reference
canon: "{project-root}/agents/canon/book-canon.md"
canon_by_agent: "{project-root}/agents/canon/book-canon-by-agent.md"

# Shared knowledge base — all agents read and write
knowledge_base: "{project-root}/planning/knowledge"
knowledge_index: "{project-root}/planning/knowledge/index.md"
lessons_path: "{project-root}/planning/knowledge"           # {agent}-lessons.md per agent

# Sync infrastructure
session_folder: "{project-root}/.flow/sessions"
sync_reports: "{project-root}/planning/sync-reports"
privacy_reports: "{project-root}/planning/privacy-reports"
priority_queues: "{project-root}/planning/priority-queues"
health_reports: "{project-root}/planning/health-reports"
build_contexts: "{project-root}/planning/build-contexts"
patterns_folder: "{project-root}/planning/knowledge/patterns"

# Model policy — applies to every subagent, helper, sub-skill, and /loop or scheduled
# trigger spawned from this project. Top-level session model is set at launch and is
# out of scope here.
#
# Principle: pick the model that matches the moment. Match the model's strength
# to the shape of the work — cheap + fast for tagging, extraction, schema emits;
# judgment-strong for generative reframing, adversarial reasoning, interpretive
# synthesis. The right model is the one that does *this specific job* well,
# not the most expensive you can afford.
model_policy:
  default: haiku                     # extraction, tagging, schema-validated emits, structured
                                     # composition, single-hop lookups. Fast, cheap, accurate
                                     # at the shape of work most Dora sub-methods produce.
  escalate_to: sonnet                # generative reframing, multi-step synthesis, adversarial
                                     # reasoning, interpretive judgment. Worth the spend when
                                     # the task's value depends on the quality of the thinking.
  forbidden: [opus]                  # off the menu — not in our cost/value band for any method
                                     # currently on the roster.

  # Per-capability hints — why *this* model for *this* method.
  hints:
    # Dora sub-methods
    sa: haiku                        # Sigil Assist: rule-based classification over a 2×2 matrix.
    hs: sonnet                       # Heuristic Scan: 4-pass expert read — judgment across
                                     # conventions, risks, gaps, recommendation.
    hmw: sonnet                      # How-Might-We: generative reframing across 5 lenses.
                                     # Haiku HMWs come back shallow and repetitive.
    jm: haiku                        # Journey Map: structured extraction into stage × dimension
                                     # table. Sonnet for Willy-scale multi-persona ethnography.
    cs: haiku                        # Competitor scan: pattern aggregation across parallels.
                                     # Sonnet when the output is a positioning-axis map.
    ip: haiku                        # Interview Plan: templated generation (cohort, RQs, guide).
    nb: haiku                        # Nugget Board: atomic-unit tagging + clustering at scale.
                                     # Sonnet when contradictions need interpretive work.
    pm: sonnet                       # Premortem: adversarial reasoning with probability × severity.
                                     # Haiku produces generic failure modes, not specific ones.
    sr: haiku                        # Stream Recap: summarization under a tight word budget.
    # Sol sub-methods
    sk: sonnet                       # Sketch: pick ONE shape over alternatives — judgment, not
                                     # enumeration. Haiku picks the first-mentioned option.
    br: sonnet                       # Brief: templated structure is Haiku-shaped, but shape choice,
                                     # AC sharpness, and out-of-scope honesty reward judgment.
    sb: sonnet                       # Storyboard: panel generation + caption tightness + branch
                                     # identification is narrative. Haiku returns screen-grabs.
    pt: sonnet                       # Pitch/RFC: long-form, interpretive, adversarial. Sonnet always.
                                     # Haiku pitches come back as feature lists under headers.
    ct: haiku                        # Concept Test: templated plan (cohort, prototype, RQs, tasks,
                                     # pass/fail). Escalate to Sonnet on novel prototype specs.
    ac: sonnet                       # Acceptance Criteria: the REWRITE pass ('should be fast' →
                                     # '≤ 500ms p95') needs domain judgment. Haiku drafts; Sonnet sharpens.
    mp: haiku                        # Measurement Plan: templated (metric, baseline, target,
                                     # instrumentation, stop-the-line). Substance is the user's, not model's.
    dl: sonnet                       # Decision Log: reasoning + reversibility + revisit conditions
                                     # reward judgment. Haiku revisits come back generic.
    ta: sonnet                       # Tradeoff Axes: naming a REAL tension vs. strawman is creative
                                     # judgment. Haiku TA reads as 'good ↔ bad'.
    wf: sonnet                       # Wireframe Spec: Saffer microinteraction annotation needs
                                     # judgment. Structural wireframe description can drop to Haiku.
    ad: sonnet                       # ADR: consequences ('becomes harder' side) require judgment.
                                     # Haiku ADRs have generic consequences like 'increases complexity'.
    # Bran sub-methods (Build phase)
    cr: haiku                        # Contract Readout: restatement + ambiguity flagging. Templated surface
                                     # with judgment on "is this AC actually concrete?". Sonnet for dense
                                     # contracts with subtle ambiguity.
    sl: sonnet                       # Slice Plan: sequencing + judgment about what unblocks what. Haiku
                                     # tends to slice along file boundaries instead of user-visible capabilities.
    ge: sonnet                       # Generate Code: pattern choice, naming, smallest-change discipline.
                                     # Drop to Haiku only for purely mechanical edits (typos, single-line config).
    te: sonnet                       # Tests: edge-case judgment, fixture design, assertion sharpness.
                                     # Haiku for simple unit tests where AC names exact inputs/outputs.
    uv: sonnet                       # UI Verify: observation + judgment on what's worth flagging vs noise.
                                     # Haiku fine for static pages or pure copy changes.
    in: sonnet                       # Instrumentation: trigger-point selection + property correctness +
                                     # honest smoke-test. Haiku for purely additive cases with one obvious entry.
    pr: haiku                        # PR Draft: templated narrative (bullets, AC table, test-plan checklist).
                                     # Escalate to Sonnet when summary needs engineering→customer translation.
    # May sub-methods (Ship phase)
    re: haiku                        # Release Readout: structured checklist + judgment about red flags.
                                     # Sonnet for handoffs with subtle deltas or interpretively-loaded test status.
    cm: haiku                        # Commit Message: templated narrative; the why is the judgment surface.
                                     # Sonnet when the why involves audience translation or regulatory framing.
    ch: haiku                        # Changelog: templated entries + audience translation. Escalate to Sonnet
                                     # when customer-facing copy must reframe engineering moves as outcomes.
    rn: sonnet                       # Release Notes: narrative writing for a public audience. Always Sonnet.
                                     # Haiku release notes come back as feature lists with section headers.
    tg: haiku                        # Tag/Version: templated emission + one judgment call (semver level).
                                     # Sonnet when change scope is genuinely ambiguous (cross-cutting refactor).
    ms: haiku                        # Measurement Setup: query + snapshot + write. Templated capture.
                                     # Sonnet when metric is composite (funnel across multi-events).
    mr: sonnet                       # Measurement Readout: honest reading + interpretive judgment about
                                     # which surprise matters. Haiku MRs come back as feature-perf summaries.
    rp: sonnet                       # Retrospective: interpretive synthesis across a long timeline + willingness
                                     # to name generative friction. Haiku retros = bulleted celebration.
    tr: haiku                        # Trust Receipt: templated emission + hash compute. Pure mechanical work;
                                     # no reason to escalate.
    nl: sonnet                       # Next-Loop Queue: judgment-weighted assembly — picking which learnings
                                     # + surprises matter for next loop. Haiku NLs = MR/RP copy-paste.
    # Helpers
    ho: haiku                        # Handoff compose: schema-validated block emission.
    hb: haiku                        # Handback compose: schema-validated reverse emission.
    # Orchestrators (Tier 0)
    apex-ca: haiku                   # Context Audit: structured read + classification.
    apex-sc: sonnet                  # Solidify Contexts: judgment-heavy synthesis across multiple contexts.
    apex-ad: haiku                   # Agent Dispatch: rule-based routing.
    apex-hr: sonnet                  # Health Report: interpretive synthesis across card history.
    apex-pq: sonnet                  # Priority Queue: judgment on what matters most.
    apex-ls: sonnet                  # Lessons Sync: cross-card learning extraction.
    guard-hs: sonnet                 # Handoff Scan: judgment on real risk vs false positive.
    guard-sa: sonnet                 # Session Audit: full context sensitivity analysis.
    guard-id: haiku                  # Injection Detect: pattern matching; fast, high recall.
    guard-dc: haiku                  # Data Classify: rule-based classification.
    guard-rd: haiku                  # Redact: substitution pattern application.
    guard-pr: sonnet                 # Privacy Report: interpretive audit + remediation.
    # Sync Agents (Tier 1)
    echo-sc: haiku                   # Session Capture: structured extraction; templated.
    echo-cp: haiku                   # Context Push: formatting for injection; mechanical.
    echo-dd: haiku                   # Diff Detect: timestamp comparison + enumeration.
    echo-si: haiku                   # Session Inventory: status classification; structured.
    echo-cr: sonnet                  # Conflict Resolve: non-trivial state divergence judgment.
    echo-sh: sonnet                  # Sync Health: interpretive synthesis of sync state.
    prism-sm: haiku                  # Session Map: inventory + adjacency; structured.
    prism-cl: sonnet                 # Cross-Link: connection judgment between sessions.
    prism-dd: sonnet                 # Dedup Detect: similarity analysis; judgment required.
    prism-or: haiku                  # Orphan Rescue: matching against existing cards; structured.
    prism-ps: sonnet                 # Pattern Surface: thematic clustering; generative.
    prism-gr: sonnet                 # Graph Report: full synthesis across all sessions.

  # Subagents get `model` passed explicitly on every spawn — no silent defaults.
  enforcement: explicit

  # effort_hints — Anthropic API effort parameter for Sonnet subagent spawns.
  # Pass alongside `model` on every Sonnet spawn. Haiku methods always run at low; omit effort for them.
  # Values: max | xhigh | high | medium | low
  # Principle: effort should match the judgment surface of the task, not its importance.
  # High effort on low-judgment tasks wastes tokens; low effort on judgment-heavy tasks produces
  # generic output that looks right but isn't (strawman axes, vague failure modes, first-instinct shapes).
  effort_hints:
    # Dora sub-methods
    hmw: high        # generative divergence; low = surface reframes, repetitive lens coverage
    pm: high         # adversarial reasoning; low = generic failure labels, not specific mechanisms
    hs: medium       # 4-pass expert read; medium balances scan depth vs cost
    jm: low          # structured extraction into stage×dimension table; no judgment reward from effort
    cs: low          # pattern aggregation; structure not synthesis
    nb: low          # atomic tagging + clustering; structural
    ip: low          # templated cohort/RQ/guide generation; effort adds nothing
    sr: low          # summarization under word budget; effort adds nothing
    # Sol sub-methods
    sk: medium       # single shape choice; medium for defensible pick vs first-mentioned option
    br: medium       # templated structure + shape choice; medium for AC sharpness
    sb: medium       # panel generation + caption tightness; medium for narrative coherence
    pt: high         # Willy pitch — long-form, evidence integration, audience-aware narrative. Max value.
    ct: low          # templated validation plan; escalate only for novel prototype specs
    ac: medium       # rewrite pass (should-be-fast → ≤500ms p95); medium for criterion sharpness
    mp: low          # templated capture; substance is user's not model's
    dl: high         # reasoning + reversibility + revisit conditions; high for genuine alternatives
    ta: high         # naming REAL tension vs strawman; low = good↔bad masquerading as an axis
    wf: medium       # microinteraction annotation; medium for Saffer-quality specs
    ad: high         # ADR consequences (becomes harder) require judgment; low = 'increases complexity'
    # Bran sub-methods
    cr: low          # contract restatement + ambiguity flag; templated surface
    sl: high         # sequencing + what-unblocks-what; low = file-boundary slices, not user-capability slices
    ge: medium       # pattern choice, naming, smallest-change discipline
    te: medium       # edge-case judgment, fixture design, assertion sharpness
    uv: medium       # observation + judgment on what's worth flagging vs noise
    in: medium       # trigger-point selection + property correctness + smoke-test honesty
    pr: low          # templated narrative; escalate when summary needs engineering→customer translation
    # May sub-methods
    re: low          # structured checklist + red-flag scan; templated
    cm: low          # commit message why-first narrative; templated
    ch: low          # changelog entry + audience translation; escalate for customer-facing reframe
    rn: medium       # public release narrative; Sonnet-medium for audience quality
    tg: low          # templated emission + single semver judgment call
    ms: low          # query + snapshot + write; mechanical capture
    mr: high         # interpretive reading — which surprise matters; low = perf-feature summary not insight
    rp: high         # retrospective synthesis; low = bulleted celebration not pattern recognition
    tr: low          # trust receipt; templated hash + emit; mechanical
    nl: high         # learning prioritization — surprising vs expected; low = MR/RP copy-paste
    # Helpers
    ho: low          # handoff compose; schema-validated block emission
    hb: low          # handback compose; schema-validated reverse emission
    # Orchestrators (Tier 0)
    apex-sc: high    # solidify contexts; judgment-heavy cross-artifact synthesis
    apex-hr: medium  # health report; interpretive across card history
    apex-pq: medium  # priority queue; balanced judgment on urgency vs value
    apex-ls: high    # lessons sync; cross-card pattern extraction
    guard-hs: medium # handoff scan; real risk vs false positive
    guard-sa: medium # session audit; full context sensitivity analysis
    guard-pr: medium # privacy report; interpretive audit
    # Sync Agents (Tier 1)
    echo-cr: medium  # conflict resolve; state divergence requires careful judgment
    echo-sh: medium  # sync health; interpretive synthesis
    prism-cl: medium # cross-link; connection judgment; medium for evidence threshold
    prism-dd: high   # dedup detect; similarity analysis; high to avoid false dups
    prism-ps: high   # pattern surface; thematic clustering; high for non-obvious patterns
    prism-gr: high   # graph report; full synthesis; high for insight quality

  # adaptive_thinking — methods where enabling extended/adaptive thinking materially improves output.
  # When spawning these as subagents and the API supports `thinking` config, enable it.
  # Always pair with effort ≥ high; thinking on low-effort spawns produces little gain.
  # Thinking mode: use `thinking: {type: "adaptive"}` (current API); older `budget_tokens` is deprecated.
  adaptive_thinking:
    enabled:
      - hmw        # reframing across 5 lenses; thinking surfaces genuinely non-obvious perspectives
      - pm         # adversarial reasoning; thinking generates specific mechanisms not generic labels
      - ta         # real tension vs strawman; thinking distinguishes genuine trade-off from cover story
      - dl         # reversibility analysis; thinking considers 2nd-order consequences
      - pt         # pitch synthesis; thinking ties Explore evidence to shape choices non-obviously
      - rp         # retrospective synthesis; thinking surfaces cross-card patterns vs single-sprint events
      - nl         # surprise-weighted prioritization; thinking elevates non-obvious signal over expected noise
      # Orchestrators
      - apex-sc    # solidify contexts; thinking surfaces non-obvious synthesis paths across artifacts
      - apex-ls    # lessons sync; thinking distinguishes real patterns from noise
      # Sync agents
      - prism-ps   # pattern surface; thinking surfaces cross-session insights not obvious from single scan
      - prism-gr   # graph report; thinking finds the cross-cutting structure in the graph
    disabled:
      - sa     # rule-based 2×2 classification; thinking adds no value
      - jm     # structured extraction table; thinking adds no value
      - nb     # atomic tagging + clustering; structural, not generative
      - sr     # summarization under word budget; thinking adds no value
      - cm     # commit message; templated; thinking adds no value
      - tr     # trust receipt; mechanical hash + emit
      - ms     # query + snapshot; mechanical capture
      # Orchestrators
      - apex-ca    # structured read + classification; no thinking value
      - apex-ad    # routing logic; rule-based
      - guard-id   # pattern matching; no thinking value
      - guard-dc   # rule-based classification; no thinking value
      - guard-rd   # substitution; mechanical
      # Sync agents
      - echo-sc    # structured extraction; templated
      - echo-cp    # formatting; mechanical
      - echo-dd    # timestamp comparison; mechanical
      - echo-si    # status classification; structured
      - prism-sm   # inventory + adjacency; structured
      - prism-or   # matching; structured
